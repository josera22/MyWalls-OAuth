<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyWalls · Autorización DeviantArt</title>
</head>
<body>
  <main>
    <h1>MyWalls</h1>
    <p id="status">Volviendo a MyWalls…</p>
    <p>Si la aplicación no se abre automáticamente, vuelve a MyWalls en tu dispositivo.</p>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const values = new URLSearchParams();
      for (const key of ["code", "state", "error", "error_description"]) {
        const value = params.get(key);
        if (value !== null) values.set(key, value);
      }
      if (!values.has("code") && !values.has("error")) {
        document.getElementById("status").textContent =
          "No se ha recibido una respuesta de autorización válida.";
        return;
      }
      const target = "mywalls://oauth/deviantart?" + values.toString();
      document.getElementById("status").textContent =
        "Abriendo MyWalls para finalizar la autorización…";
      window.location.replace(target);
    })();
  </script>
</body>
</html>
